services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - venv:/home/vscode/app/.venv
      - uv-cache:/home/vscode/.cache/uv
      - ../:/home/vscode/app:cached
      - ../config.ini:/home/vscode/.gamdl/config.ini
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    tty: true
    stdin_open: true

  wrapper:
    image: ghcr.io/tkgstrator/wrapper:v3.0.0
    volumes:
      - ./rootfs/data:/app/rootfs/data:cached
    cap_add:
      - SYS_ADMIN
      - SYS_CHROOT
      - SYS_PTRACE
    security_opt:
      - apparmor:unconfined
    environment:
      # Sign in on startup when the cached Apple session cannot be restored.
      # Values come from .devcontainer/.env (see .env.example).
      WRAPPER_USERNAME: ${USERNAME:-}
      WRAPPER_PASSWORD: ${PASSWORD:-}
    restart: unless-stopped

volumes:
  venv:
  uv-cache:
