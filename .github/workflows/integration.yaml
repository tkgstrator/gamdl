name: Integration

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop
  workflow_dispatch:

jobs:
  ci-change-scope:
    permissions:
      contents: read
    uses: ./.github/workflows/ci-change-scope.yaml
    with:
      doc-paths: '["AGENTS.md","CLAUDE.md","docs/development/ci-change-scope.md"]'
      doc-prefixes: '[]'
      runner: '"ubuntu-latest"'

  lint-actions:
    name: actionlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run actionlint
        uses: rhysd/actionlint@v1.7.12

  lint-dockerfile:
    name: hadolint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        dockerfile:
          - Dockerfile
          - .devcontainer/Dockerfile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run hadolint on ${{ matrix.dockerfile }}
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: ${{ matrix.dockerfile }}

  lint-python:
    name: uv + ruff
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Sync project (lockfile check)
        run: uv sync --locked

      - name: Format check (ruff)
        run: uv run --locked ruff format --check --exclude gamdl .

      - name: Lint (ruff)
        run: |
          uv run --locked ruff check --exclude gamdl .
          # Keep the imported upstream style; check its syntax and name errors.
          uv run --locked ruff check --isolated gamdl --select E9,F63,F7,F82

  test-native:
    if: ${{ !cancelled() && (true) }}
    needs: ["ci-change-scope"]
    name: Rust tests and CLI smoke test (${{ matrix.python-version }})
    runs-on: ${{ fromJSON((needs['ci-change-scope'].result == 'success' && needs['ci-change-scope'].outputs.docs_only == 'true') && '"ubuntu-latest"' || '"ubuntu-latest"') }}
    strategy:
      matrix:
        python-version: ["3.10", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        if: ${{ (needs['ci-change-scope'].result != 'success' || needs['ci-change-scope'].outputs.docs_only != 'true') }}
      - uses: astral-sh/setup-uv@v8.2.0
        if: ${{ (needs['ci-change-scope'].result != 'success' || needs['ci-change-scope'].outputs.docs_only != 'true') }}
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ (needs['ci-change-scope'].result != 'success' || needs['ci-change-scope'].outputs.docs_only != 'true') }}
      - run: uv sync --locked
        if: ${{ (needs['ci-change-scope'].result != 'success' || needs['ci-change-scope'].outputs.docs_only != 'true') }}
      - run: uv run --locked python -m gamdl --help
        if: ${{ (needs['ci-change-scope'].result != 'success' || needs['ci-change-scope'].outputs.docs_only != 'true') }}
      - name: Test native extension
        if: ${{ (needs['ci-change-scope'].result != 'success' || needs['ci-change-scope'].outputs.docs_only != 'true') }}
        run: |
          export PYO3_PYTHON="$PWD/.venv/bin/python"
          LD_LIBRARY_PATH="$(uv run --locked python -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export LD_LIBRARY_PATH
          cargo test --locked --manifest-path gamdl/downloader/ammuxer/Cargo.toml

      - name: Docs-only exemption
        if: ${{ needs['ci-change-scope'].result == 'success' && needs['ci-change-scope'].outputs.docs_only == 'true' }}
        shell: bash
        working-directory: .
        env:
          CI_CHANGE_REASON: ${{ needs['ci-change-scope'].outputs.reason }}
        run: |
          printf '%s\n' "$CI_CHANGE_REASON" >> "$GITHUB_STEP_SUMMARY"
  build-smoke:
    if: ${{ !cancelled() && (true) }}
    needs: ["ci-change-scope"]
    name: ${{ matrix.python-version == '3.10' && matrix.base-image == 'bookworm-slim' && 'docker build smoke (no push)' || format('docker build smoke (amd64, Python {0}, {1})', matrix.python-version, matrix.base-image) }}
    runs-on: ${{ fromJSON((needs['ci-change-scope'].result == 'success' && needs['ci-change-scope'].outputs.docs_only == 'true') && '"ubuntu-latest"' || '"ubuntu-latest"') }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # One AMD64 and one native ARM64 build at a time across these jobs.
      max-parallel: 1
      matrix:
        python-version: ["3.10", "3.14"]
        base-image: ["bookworm-slim", "trixie-slim"]
    env:
      RUNTIME_ARCH: amd64
      PYTHON_VERSION: ${{ matrix.python-version }}
      BASE_IMAGE: ${{ matrix.base-image }}
      IMAGE: gamdl-ci:${{ github.run_id }}-${{ github.run_attempt }}-amd64-${{ matrix.python-version }}-${{ matrix.base-image }}
      BUILDER: gamdl-${{ github.run_id }}-${{ github.run_attempt }}-amd64-${{ matrix.python-version }}-${{ matrix.base-image }}
      EVIDENCE_NAME: gamdl-hls-amd64-${{ matrix.python-version }}-${{ matrix.base-image }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout repository
        if: ${{ needs['ci-change-scope'].result != 'success' || needs['ci-change-scope'].outputs.docs_only != 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Record immutable inputs and native runner preflight
        if: ${{ needs['ci-change-scope'].result != 'success' || needs['ci-change-scope'].outputs.docs_only != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          export EVIDENCE_DIR="$RUNNER_TEMP/$EVIDENCE_NAME"
          printf 'EVIDENCE_DIR=%s\n' "$EVIDENCE_DIR" >> "$GITHUB_ENV"
          version=$(python3 -c 'import tomllib; from pathlib import Path; print(tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"])')
          printf 'GAMDL_VERSION=%s\n' "$version" >> "$GITHUB_ENV"
          python3 scripts/verify-container-hls.py --prepare --require-linux-host \
            --expected-version "$version" --expected-arch "$RUNTIME_ARCH" \
            --python-version "$PYTHON_VERSION" --base-image "$BASE_IMAGE" --evidence-dir "$EVIDENCE_DIR"

      - name: Set up QEMU
        if: ${{ needs['ci-change-scope'].result != 'success' || needs['ci-change-scope'].outputs.docs_only != 'true' }}
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up dedicated Docker Buildx
        id: buildx
        if: ${{ needs['ci-change-scope'].result != 'success' || needs['ci-change-scope'].outputs.docs_only != 'true' }}
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          name: ${{ env.BUILDER }}

      - name: Build image (linux/amd64, no push)
        id: build
        if: ${{ needs['ci-change-scope'].result != 'success' || needs['ci-change-scope'].outputs.docs_only != 'true' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        env:
          BUILDX_METADATA_PROVENANCE: max
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.IMAGE }}
          build-args: |
            PYTHON_VERSION=${{ env.PYTHON_VERSION }}
            BASE_IMAGE=${{ env.BASE_IMAGE }}
          # Preserve the original default AMD64 cache; other variants do not export it.
          cache-from: ${{ matrix.python-version == '3.10' && matrix.base-image == 'bookworm-slim' && 'type=gha' || '' }}
          cache-to: ${{ matrix.python-version == '3.10' && matrix.base-image == 'bookworm-slim' && 'type=gha,mode=max' || '' }}

      - name: Retain build metadata and reclaim only this builder cache
        if: ${{ needs['ci-change-scope'].result != 'success' || needs['ci-change-scope'].outputs.docs_only != 'true' }}
        shell: bash
        env:
          BUILD_IMAGE_ID: ${{ steps.build.outputs.imageid }}
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import json
          import os
          import re
          from pathlib import Path

          def require(condition, message):
              if not condition:
                  raise SystemExit(message)

          # Pinned build-push-action v7 / toolkit 0.100.0 keeps this file until post.
          # Full max provenance exceeds Linux's per-environment-string size limit.
          matches = []
          for path in Path(os.environ["RUNNER_TEMP"]).glob("docker-actions-toolkit-*/build-metadata-*.json"):
              metadata = json.loads(path.read_text())
              if (metadata.get("buildx.build.ref", "").split("/")[0] == os.environ["BUILDER"]
                      and metadata.get("image.name") == "docker.io/library/" + os.environ["IMAGE"]):
                  matches.append((path, metadata))
          require(len(matches) == 1, "Expected exactly one metadata file for this builder and image")
          path, metadata = matches[0]
          require(metadata["containerimage.descriptor"]["platform"] == {
              "os": "linux", "architecture": os.environ["RUNTIME_ARCH"],
          }, "Build metadata platform mismatch")
          require(metadata["containerimage.config.digest"] == os.environ["BUILD_IMAGE_ID"],
                  "Build metadata config digest mismatch")
          require(metadata["containerimage.digest"] == os.environ["BUILD_DIGEST"],
                  "Build metadata image digest mismatch")
          materials = metadata["buildx.build.provenance"]["materials"]
          require(materials and all(material.get("uri") and re.fullmatch(
              "[0-9a-f]{64}", material.get("digest", {}).get("sha256", ""),
          ) for material in materials), "Resolved provenance materials missing")
          evidence = Path(os.environ["EVIDENCE_DIR"])
          (evidence / "build-metadata.json").write_text(json.dumps({
              "metadata": metadata, "metadataFile": str(path),
              "imageId": os.environ["BUILD_IMAGE_ID"], "digest": os.environ["BUILD_DIGEST"],
          }, indent=2) + "\n")
          PYTHON
          docker buildx prune --builder "$BUILDER" --all --force

      - name: Verify both CLIs and offline synthetic HLS output
        if: ${{ needs['ci-change-scope'].result != 'success' || needs['ci-change-scope'].outputs.docs_only != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify-container-hls.py --image "$IMAGE" --require-linux-host \
            --expected-version "$GAMDL_VERSION" --expected-arch "$RUNTIME_ARCH" \
            --python-version "$PYTHON_VERSION" --base-image "$BASE_IMAGE" --evidence-dir "$EVIDENCE_DIR"

      - name: Summarize retained verification evidence
        if: ${{ always() && (needs['ci-change-scope'].result != 'success' || needs['ci-change-scope'].outputs.docs_only != 'true') }}
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          evidence = Path(os.environ["RUNNER_TEMP"]) / os.environ["EVIDENCE_NAME"]
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as summary:
              summary.write("### Native container verification\n")
              for name in ("preflight.json", "result.json", "runtime/result.json"):
                  path = evidence / name
                  state = json.loads(path.read_text()).get("status", "UNKNOWN") if path.exists() else "NOT_RUN"
                  summary.write(f"- {name}: {state}\n")
          PYTHON

      - name: Upload verification records
        if: ${{ always() && (needs['ci-change-scope'].result != 'success' || needs['ci-change-scope'].outputs.docs_only != 'true') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: container-hls-amd64-${{ matrix.python-version }}-${{ matrix.base-image }}
          path: ${{ runner.temp }}/${{ env.EVIDENCE_NAME }}
          if-no-files-found: error
          retention-days: 14

      - name: Remove only this job's loaded image
        if: ${{ always() && (needs['ci-change-scope'].result != 'success' || needs['ci-change-scope'].outputs.docs_only != 'true') }}
        shell: bash
        run: |
          set -euo pipefail
          if docker image inspect "$IMAGE" >/dev/null 2>&1; then
            docker image rm "$IMAGE"
          fi

      - name: Docs-only exemption
        if: ${{ needs['ci-change-scope'].result == 'success' && needs['ci-change-scope'].outputs.docs_only == 'true' }}
        shell: bash
        working-directory: .
        env:
          CI_CHANGE_REASON: ${{ needs['ci-change-scope'].outputs.reason }}
        run: |
          printf '%s\n' "$CI_CHANGE_REASON" >> "$GITHUB_STEP_SUMMARY"

  build-smoke-arm64:
    if: ${{ !cancelled() && (true) }}
    needs: ["ci-change-scope"]
    name: native ARM64 HLS (Python ${{ matrix.python-version }}, ${{ matrix.base-image }})
    runs-on: ${{ fromJSON((needs['ci-change-scope'].result == 'success' && needs['ci-change-scope'].outputs.docs_only == 'true') && '"ubuntu-latest"' || '"ubuntu-24.04-arm"') }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # One AMD64 and one native ARM64 build at a time across these jobs.
      max-parallel: 1
      matrix:
        python-version: ["3.10", "3.14"]
        base-image: ["bookworm-slim", "trixie-slim"]
    env:
      RUNTIME_ARCH: arm64
      PYTHON_VERSION: ${{ matrix.python-version }}
      BASE_IMAGE: ${{ matrix.base-image }}
      IMAGE: gamdl-ci:${{ github.run_id }}-${{ github.run_attempt }}-arm64-${{ matrix.python-version }}-${{ matrix.base-image }}
      BUILDER: gamdl-${{ github.run_id }}-${{ github.run_attempt }}-arm64-${{ matrix.python-version }}-${{ matrix.base-image }}
      EVIDENCE_NAME: gamdl-hls-arm64-${{ matrix.python-version }}-${{ matrix.base-image }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout repository
        if: ${{ needs['ci-change-scope'].result != 'success' || needs['ci-change-scope'].outputs.docs_only != 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Record immutable inputs and native runner preflight
        if: ${{ needs['ci-change-scope'].result != 'success' || needs['ci-change-scope'].outputs.docs_only != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          export EVIDENCE_DIR="$RUNNER_TEMP/$EVIDENCE_NAME"
          printf 'EVIDENCE_DIR=%s\n' "$EVIDENCE_DIR" >> "$GITHUB_ENV"
          version=$(python3 -c 'import tomllib; from pathlib import Path; print(tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"])')
          printf 'GAMDL_VERSION=%s\n' "$version" >> "$GITHUB_ENV"
          python3 scripts/verify-container-hls.py --prepare --require-linux-host \
            --expected-version "$version" --expected-arch "$RUNTIME_ARCH" \
            --python-version "$PYTHON_VERSION" --base-image "$BASE_IMAGE" --evidence-dir "$EVIDENCE_DIR"

      - name: Set up dedicated Docker Buildx
        id: buildx
        if: ${{ needs['ci-change-scope'].result != 'success' || needs['ci-change-scope'].outputs.docs_only != 'true' }}
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          name: ${{ env.BUILDER }}

      - name: Build image (linux/arm64, no push)
        id: build
        if: ${{ needs['ci-change-scope'].result != 'success' || needs['ci-change-scope'].outputs.docs_only != 'true' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        env:
